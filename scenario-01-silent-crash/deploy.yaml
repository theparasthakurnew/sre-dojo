apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-web-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
      nodeSelector:
        hardware-type: quantum-computer # Intentionally impossible label
